<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Cards with Hover & Seamless Click</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HTML5 Video Background Tags para sa bawat kanta -->
  <video id="bgVideo1" class="video-background" loop playsinline>
    <source src="1011.mp4">
  </video>

  <video id="bgVideo2" class="video-background" loop playsinline>
    <source src="Chase Atlantic - HEAVEN AND BACK - CHASE ATLANTIC (1080p).mp4">
  </video>

  <video id="bgVideo3" class="video-background" loop playsinline>
    <source src="Sickick - Mind Games (Audio) - SickickMusic (1080p).mp4">
  </video>

  <video id="bgVideo4" class="video-background" loop playsinline>
    <source src="Nova - Not Around (Official Visualizer) - NOVA (1080p).mp4">
  </video>

  <div class="main">
    <!-- Container 1 -->
    <div class="container1" onmouseenter="hoverPlay(1)" onmouseleave="hoverStop(1)" onclick="song1(event)">
      <button onclick="back(event, 1)" class="backbtn">X</button>
      <div class="imgtitle1">
        <img src="https://image-cdn-ak.spotifycdn.com/image/ab67616d00001e029b6ac98a52f62d5cb473da40" />
        <div class="title">
          <h2>Softcore</h2>
          <p class="artist">The Neighbourhood</p>
        </div>
      </div>
      <div class="song1lyrics">
      </div>
      <div class="controls">
        <button onclick="previousSong(1)" class="previous">&#x23EE;</button>
        <button onclick="pausebtn1()" class="pause">&#9208;</button>
        <button onclick="nextSong(1)" class="next">&#x23ED;</button>
      </div>
      <input class="range" type="range" value="0" min="0" max="100" />
    </div>

    <!-- Container 2 -->
    <div class="container2" onmouseenter="hoverPlay(2)" onmouseleave="hoverStop(2)" onclick="song2(event)">
      <button onclick="back(event, 2)" class="backbtn">X</button>
      <div class="imgtitle2">
        <img
          src="https://e.snmc.io/i/600/w/2acc8a70dca939250005ea76b6c064af/8367507/Chase%20Atlantic%20-%20PHASES%2C%20Cover%20art.webp" />
        <div class="title">
          <h3>HEAVEN AND BACK</h3>
          <p class="artist">Chase Atlantic</p>
        </div>
      </div>
      <div class="song2lyrics">
      </div>
      <div class="controls">
        <button onclick="previousSong(2)" class="previous">&#x23EE;</button>
        <button onclick="pausebtn2()" class="pause">&#9208;</button>
        <button onclick="nextSong(2)" class="next">&#x23ED;</button>
      </div>
      <input class="range" type="range" value="0" min="0" max="100" />
    </div>

    <!-- Container 3 -->
    <div onmouseenter="hoverPlay(3)" onmouseleave="hoverStop(3)" onclick="song3(event)" class="container3">
      <button onclick="back(event, 3)" class="backbtn">X</button>
      <div class="imgtitle3">
        <img
          src="https://t2.genius.com/unsafe/430x430/https%3A%2F%2Fimages.genius.com%2F808d40267ffa56f05caa1c0a1ae80d0c.1000x1000x1.png" />
        <div class="title">
          <h2>Mind Games</h2>
          <p class="artist">Sickick</p>
        </div>
      </div>
      <div class="song3lyrics">
      </div>
      <div class="controls">
        <button onclick="previousSong(3)" class="previous">&#x23EE;</button>
        <button onclick="pausebtn3()" class="pause">&#9208;</button>
        <button onclick="nextSong(3)" class="next">&#x23ED;</button>
      </div>
      <input class="range" type="range" value="0" min="0" max="100" />
    </div>

    <!-- Container 4 -->
    <div onmouseenter="hoverPlay(4)" onmouseleave="hoverStop(4)" onclick="song4(event)" class="container4">
      <button onclick="back(event, 4)" class="backbtn">X</button>
      <div class="imgtitle4">
        <img
          src="https://lastfm-img.freetls.fastly.net/i/u/770x0/40172086022d4db4bfd94788259cc5d0.jpg#40172086022d4db4bfd94788259cc5d0" />
        <div class="title">
          <h3>Not Around</h3>
          <p class="artist">Nova</p>
        </div>
      </div>
      <div class="song4lyrics"></div>
      <div class="controls">
        <button onclick="previousSong(4)" class="previous">&#x23EE;</button>
        <button onclick="pausebtn4()" class="pause">&#9208;</button>
        <button onclick="nextSong(4)" class="next">&#x23ED;</button>
      </div>
      <input class="range" type="range" value="0" min="0" max="100" />
    </div>
  </div>
</body>
<script src="script.js"></script>

</html>
